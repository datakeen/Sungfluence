# Publishes the website and the web app to GitHub Pages on every push to main.
#   https://datakeen.github.io/Sungfluence/       the website (site/), with 404.html for missing pages
#   https://datakeen.github.io/Sungfluence/try/   the web app (src/). People can choose "Install" there to keep it as an app.
name: Web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the app first, then the website, which copies the app into pages/try
      - run: node scripts/build.js
      - run: node scripts/site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deploy
        uses: actions/deploy-pages@v4
