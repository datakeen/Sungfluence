# Builds installers for Windows, macOS and Linux.
# Push a tag such as v1.0.0 and the files appear on a draft GitHub Release.
# Only the files people download are made: no combined Windows installer, and no update files (latest.yml, .blockmap),
# because the app does not update itself.
# You can also run it by hand from the Actions tab; the files are then attached to the run.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Build
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds by default. Add signing secrets later (see README) to sign.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows on ARM gets its own installer. Built in a second run, so no combined installer of both is made.
      - name: Build the Windows ARM installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --arm64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: sungfluence-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: ignore
