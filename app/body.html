<div class="app" id="app">
  <nav class="menubar" id="menubar" aria-label="Menu" hidden></nav>
  <header class="top">
    <div class="top-l">
      <div class="brand"><img class="brand-icon" src="icons/icon.svg" alt="" width="22" height="22"><span class="brand-mark">Sung<b>Fluence</b></span><span class="file" id="fileName">cat.jpg</span></div>
      <button class="btn" id="newBtn" type="button" title="Start from a blank artboard (N with Shift)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
        New
      </button>
      <label class="btn" for="fileInput" title="Open an image or a SungFluence project">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        Open
      </label>
      <input id="fileInput" type="file" accept="image/*,.json" hidden>
      <div class="samples" id="samples"></div>
    </div>
    <div class="seg viewseg" id="viewSeg" role="group" aria-label="View">
      <button type="button" data-view="photo" title="Photo and vector only (1)">Photo</button>
      <button type="button" data-view="mix" title="Text art over a faded photo (2)">Mix</button>
      <button type="button" data-view="text" title="Text art only (3)">Text</button>
    </div>
    <div class="top-r">
      <button class="btn icon-only btn-quiet" id="undoBtn" type="button" aria-label="Undo" title="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="btn icon-only btn-quiet" id="redoBtn" type="button" aria-label="Redo" title="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="btn btn-quiet" id="pluginsBtn" type="button" title="Plugins: add, remove or make extra effects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h4v2.5a1.5 1.5 0 0 0 3 0V4h4v5h-2.5a1.5 1.5 0 0 0 0 3H20v8h-5v-2.5a1.5 1.5 0 0 0-3 0V20H4v-6h2.5a1.5 1.5 0 0 0 0-3H4V4z"/></svg>
        Plugins
      </button>
      <button class="btn icon-only btn-quiet" id="settingsBtn" type="button" aria-label="Settings" title="Settings: zoom and look"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="btn icon-only btn-quiet" id="helpBtn" type="button" aria-label="Keyboard shortcuts and about" aria-expanded="false" title="Keyboard shortcuts and about">?</button>
      <button class="btn" id="splitBtn" type="button" aria-pressed="false" title="Compare with a divider: one look on each side (/)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 2v20"/></svg>
        Compare
      </button>
      <button class="btn" id="compareBtn" type="button" title="Hold to see the original photo (\)">Original</button>
      <button class="btn btn-primary" id="exportBtn" type="button" aria-haspopup="true" aria-expanded="false">Export</button>
    </div>
  </header>

  <div class="main">
    <nav class="rail" id="rail" aria-label="Tools"></nav>
    <section class="stage" aria-label="Artwork">
      <div class="optbar" id="optbar"></div>
      <div class="viewport" id="viewport">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="frame" id="frame">
            <canvas id="art" width="1600" height="1066" role="img" aria-label="Artwork"></canvas>
            <svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
            <div class="split-h" id="splitH" role="slider" tabindex="0" aria-label="Compare divider" hidden><i></i><b></b><span class="split-tag l" id="splitTagL"></span><span class="split-tag r" id="splitTagR"></span></div>
          </div>
        </div>
        <div class="splitbar" id="splitBar" hidden></div>
        <div class="brush-ring" id="brushRing" hidden></div>
        <div class="zoom-hud" id="zoomHud" hidden></div>
        <div class="hud" id="hud" role="status" aria-live="polite" hidden>
          <div class="hud-row"><b id="hudStage">Working</b><span id="hudPct">0%</span><button class="mini-btn" id="hudCancel" type="button">Cancel</button></div>
          <div class="hud-bar"><i id="hudBar"></i></div>
        </div>
        <div class="cta" id="cta" hidden></div>
        <div class="drop-hint" id="dropHint" hidden>Drop an image to start</div>
      </div>
      <div class="stage-bar">
        <div class="zoom" role="group" aria-label="Zoom">
          <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out (Ctrl -)">&minus;</button>
          <button type="button" id="zoomPct" aria-label="Zoom size and presets" aria-haspopup="true" title="Zoom presets and slider">Fit</button>
          <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in (Ctrl +)">+</button>
          <button type="button" id="zoomFit" aria-label="Fit to window" title="Fit to window (Ctrl 0)">Fit</button>
        </div>
        <div class="quality"><span>Preview</span><div class="seg" id="qualitySeg" role="group" aria-label="Preview quality"></div></div>
        <div class="status" id="status">Loading</div>
        <form class="ai" id="aiForm" hidden>
          <input id="aiInput" type="text" placeholder="Describe a look, e.g. white line text for a black T-shirt" autocomplete="off" aria-label="Describe a look for Claude">
          <button class="btn" type="submit" id="aiBtn">Direct</button>
        </form>
      </div>
    </section>
    <aside class="inspector" aria-label="Inspector">
      <div class="stack" id="stack"></div>
      <div class="seg tabs" id="tabs" role="group" aria-label="Panels"></div>
      <div class="panel" id="panel"></div>
    </aside>
  </div>
</div>

<div class="menu" id="exportMenu" role="menu" hidden></div>
<div class="menu zoom-menu" id="zoomMenu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="help" id="help" role="dialog" aria-label="Keyboard shortcuts" hidden></div>
<div class="scrim" id="libScrim" hidden><div class="sheet" id="library" role="dialog" aria-modal="true" aria-labelledby="libTitle"></div></div>
<div class="scrim" id="dlgScrim" hidden><div class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div></div>
