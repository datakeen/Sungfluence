<!doctype html>
<!-- The sharing picture (og.jpg, 1200 by 630). scripts/site-images.js takes a screenshot of this page.
     It is not published: scripts/site.js leaves it out. SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/fonts/fonts.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #121317; }
.card { position: relative; width: 1200px; height: 630px; }
.pic { position: absolute; top: 0; right: 0; width: 630px; height: 630px; overflow: hidden; }
.pic img { position: absolute; inset: 0; width: 630px; height: 630px; object-fit: cover; }
.pic .art { clip-path: inset(0 0 0 50%); }
.div { position: absolute; top: 0; bottom: 0; left: 315px; width: 2px; margin-left: -1px; background: rgba(246, 241, 231, .8); }
.div span { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #f6f1e7; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.fade { position: absolute; top: 0; bottom: 0; left: 540px; width: 110px; background: linear-gradient(90deg, #121317, rgba(18, 19, 23, 0)); }
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; color: #f3efe6; font-family: Inter, sans-serif; }
.icon { width: 64px; height: 64px; margin-bottom: 30px; }
h1 { margin: 0; font: 700 80px/.95 'Playfair Display', serif; letter-spacing: -.035em; }
h1 b { color: #f0b04f; font-weight: 700; }
p { margin: 26px 0 0; max-width: 440px; text-wrap: balance; font-size: 32px; line-height: 1.25; font-weight: 500; letter-spacing: -.01em; }
small { display: block; margin-top: 34px; font: 400 17px/1.4 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #f0b04f; }
</style>
</head>
<body>
<div class="card">
  <div class="pic"><img src="img/photo-coffee.webp" alt=""><img class="art" src="img/coffee-halftone.webp" alt=""><div class="div"><span></span></div></div>
  <div class="fade"></div>
  <div class="text">
    <img class="icon" src="../app/icon.svg" alt="">
    <h1>Sung<b>Fluence</b></h1>
    <p>Turn any photo into art made of letters.</p>
    <small>Free · Open source · Offline</small>
  </div>
</div>
</body>
</html>
