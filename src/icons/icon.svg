<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- SungFluence icon: S and F in the style of the wordmark, a light S and a gold F on deep ink.
       The letters are drawn as shapes, so the icon looks the same everywhere. SPDX-License-Identifier: AGPL-3.0-or-later -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22232a"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="281" x2="0" y2="743">
      <stop offset="0" stop-color="#f2c066"/>
      <stop offset="1" stop-color="#d9932f"/>
    </linearGradient>
    <linearGradient id="ivory" gradientUnits="userSpaceOnUse" x1="0" y1="281" x2="0" y2="743">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#e6dfd2"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>
  <!-- S -->
  <path d="M452 368 C432 334 394 321 344 321 C278 321 232 352 232 414 C232 476 288 494 344 508 C404 523 456 545 456 612 C456 675 404 703 342 703 C282 703 240 682 222 642"
        fill="none" stroke="url(#ivory)" stroke-width="80" stroke-linecap="butt" stroke-linejoin="round"/>
  <!-- F -->
  <g fill="url(#gold)">
    <rect x="566" y="281" width="80" height="462"/>
    <rect x="566" y="281" width="252" height="80"/>
    <rect x="566" y="478" width="214" height="76"/>
  </g>
</svg>
